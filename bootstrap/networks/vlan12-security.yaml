# External VM network for security (10.120.12.0/24, gw .1, router DHCP).
# Route is auto: the controller fills cidr/gateway/connectivity from DHCP.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: vlan12-security
  namespace: harvester-public
  annotations:
    network.harvesterhci.io/route: '{"mode":"auto","serverIPAddr":"","cidr":"","gateway":""}'
  labels:
    network.harvesterhci.io/clusternetwork: external
    network.harvesterhci.io/type: L2VlanNetwork
    network.harvesterhci.io/vlan-id: '12'
spec:
  config: '{"cniVersion":"0.3.1","name":"vlan12-security","type":"bridge","bridge":"external-br","promiscMode":true,"vlan":12,"ipam":{},"mtu":9000}'
