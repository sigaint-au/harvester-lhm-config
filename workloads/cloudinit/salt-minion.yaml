#cloud-config
# Salt minion bootstrap for openSUSE Tumbleweed guests.
# Usage: paste into a VM's cloudInitNoCloud userData (after any users:/ssh
# block), or keep as the single userData document.
# After first boot, accept the minion key on the master: salt-key -a <hostname>
package_update: true
package_upgrade: false

packages:
  - salt-minion

write_files:
  - path: /etc/salt/minion
    owner: root:root
    permissions: '0644'
    content: |
      # Salt Minion Configuration for openSUSE Tumbleweed
      # Generated by cloud-init

      # Master configuration. NOTE: entries must be bare hostnames OR bare
      # IPs — "hostname IP" pairs on one line are not valid and the minion
      # will fail to resolve them. Hostnames are used here, so guest DNS
      # must resolve *.prod.sigaint.au. Tried in listed order; the minion
      # fails over to the next one if the current master is unreachable.
      master:
        - salt-42e5.overstate.syd.prod.sigaint.au
        - salt-b2b6.overstate.syd.prod.sigaint.au
        - salt-c010.overstate.syd.prod.sigaint.au

      # Minion id defaults to the guest hostname (set via cloud-init
      # hostname:). Override here only if you need something explicit.
      # id: my-hostname

      log_level: info

runcmd:
  # Enable and start the minion immediately (package creates /etc/salt/pki)
  - systemctl enable --now salt-minion

  # Log the startup status for verification
  - journalctl -u salt-minion -n 20 --no-pager || true
