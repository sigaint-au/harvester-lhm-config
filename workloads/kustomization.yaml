apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespaces/server-lhm-prod.yaml
  - namespaces/servers-lhm-dev.yaml
  - images/tumbleweed-minimal.yaml
  - images/fedora-44-uki.yaml
  - images/win11-iot-ltsc24-iso.yaml
  - keys/mhahl-sk-ecdsa.yaml
  - keys/mhahl-sk-ed25519.yaml
  - addons/pcidevices-controller.yaml
  - addons/kubeovn-operator.yaml
  - addons/rancher-monitoring.yaml
  - addons/rancher-logging.yaml
  - settings/backup-target.yaml
  - templates/tumbleweed-amd64-50g-ssd-p400.yaml
  - templates/tumbleweed-amd64-50g-ssd-p400-r1.yaml
  - templates/win11-iot-ltsc-2024-amd64-80g-ssd.yaml
  - templates/win11-iot-ltsc-2024-amd64-80g-ssd-r1.yaml
  - pcidevices/p400-49f4-00.0.yaml
  - pcidevices/p400-49f4-00.1.yaml
  - pcidevices/p400-527f-00.0.yaml
  - pcidevices/p400-527f-00.1.yaml

# Cloud config templates (Advanced > Cloud Config Templates in the UI).
# Built from workloads/cloudinit/ so the files stay single source. The
# harvesterhci.io/cloud-init-template label is what the UI lists; the data
# key must be exactly `cloudInit`. No name hash so references stay stable.
# NOTE: salt-tumbleweed-base.yaml keeps `hostname: CHANGEME` on purpose —
# the UI copies template content into the per-VM editor, and a baked
# hostname would duplicate Salt minion IDs. Set it per VM at creation.
configMapGenerator:
  - name: salt-tumbleweed-base
    options:
      disableNameSuffixHash: true
      labels:
        harvesterhci.io/cloud-init-template: user
    files:
      - cloudInit=cloudinit/salt-tumbleweed-base.yaml
  - name: dhcp-network
    options:
      disableNameSuffixHash: true
      labels:
        harvesterhci.io/cloud-init-template: network
    files:
      - cloudInit=cloudinit/dhcp-network.yaml
