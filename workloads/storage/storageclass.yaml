# Longhorn tier StorageClasses. Disks are picked by tag (applied via
# tag-longhorn-disks.py from nodes.yaml `storage.longhorn_tiers`):
# `longhorn-ssd` -> sdb+sdc, `longhorn-hdd` -> sdd. Replica 3 across the
# 3 hosts. `longhorn-hdd` is the cluster default; anything performance
# sensitive (VM roots, images) must still request `longhorn-ssd`
# explicitly per volume.
# SSD tier: VM roots, images, system volumes.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-ssd
provisioner: driver.longhorn.io
parameters:
  numberOfReplicas: "3"
  diskSelector: "ssd"
  # Required for Harvester VM disks (RWX): lets the attachment follow
  # the pod between nodes (live migration). Without it Longhorn pins
  # the volume behind a share-manager on the wrong node and the
  # virt-launcher fails mapping with FailedMapVolume. Matches
  # Harvester's own harvester-longhorn class.
  migratable: "true"
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: Immediate
---
# HDD tier: bulk data. Cluster default.
# NOTE: no `migratable` here (unlike longhorn-ssd): StorageClass
# parameters are immutable, and longhorn-hdd cannot be deleted +
# recreated while the VM images target it. Keep VM disks on
# longhorn-ssd; use HDD for bulk data only.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-hdd
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: driver.longhorn.io
parameters:
  numberOfReplicas: "3"
  diskSelector: "hdd"
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: Immediate
