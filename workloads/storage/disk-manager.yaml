# Longhorn keeps all three data disks per node (see nodes.yaml `storage`):
# /dev/sdb + /dev/sdc (SSD tier) and /dev/sdd (HDD tier). Tiering itself is
# by disk tag (see tag-longhorn-disks.py); this ConfigMap only pins the
# device set. Apply IMMEDIATELY after install, before Longhorn
# auto-provisions anything else. v1.8+ replacement for the legacy
# auto-disk-provision-paths setting.
apiVersion: v1
kind: ConfigMap
metadata:
  name: harvester-node-disk-manager
  namespace: harvester-system
data:
  autoprovision.yaml: |
    - hostname: "*"
      devices:
        - "/dev/sdb"
        - "/dev/sdc"
        - "/dev/sdd"
  filters.yaml: |
    - hostname: "*"
      excludeLabels: ["COS_*", "HARV_*"]
