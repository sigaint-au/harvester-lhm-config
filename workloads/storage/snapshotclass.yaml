# Snapshot class for Longhorn volumes. Referenced by the csi-driver-config
# Setting (VM snapshots + backups). Default class so UI snapshot flows
# resolve without an explicit pick.
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: longhorn-snapshot
  annotations:
    snapshot.storage.kubernetes.io/is-default-class: "true"
driver: driver.longhorn.io
deletionPolicy: Delete
