# Phase 5a backup target.
backup_target:
  type: nfs
  endpoint: "nfs://10.120.14.100:/Backup"
  refreshIntervalInSeconds: 60

# Redeploy storage layout: Rook-Ceph (converged) is the primary VM storage;
# Longhorn is retained for system volumes, VM images default, and VM backups
# (Harvester backups only work on Longhorn volumes).
# Hosts: Dell R630, dual CPU, 100+GB RAM each — the Ceph daemon footprint
# below (~4 OSDs x 2Gi + mons/mgrs per node) is comfortably within capacity.
storage:
  # Longhorn keeps exactly one disk per node. Enforced post-install via
  # workloads/storage/disk-manager.yaml (harvester-node-disk-manager
  # ConfigMap) — apply it BEFORE Longhorn auto-provisions the Ceph disks.
  longhorn_disks:
    - /dev/sdb
  # Rook OSD device filter (CephCluster spec.storage.deviceFilter).
  # Matches sdc+ on every node; 49f4 has no sdg, the filter simply matches
  # what exists. /dev/sdb is excluded so Longhorn keeps its disk.
  ceph_device_filter: "^sd[c-g]$"
  # Pinned versions. Rook v1.20.x supports the RKE2 v1.36 in Harvester v1.9;
  # Ceph Tentacle is Rook's default for this line. Re-pin deliberately.
  rook_version: v1.20.8
  ceph_image: quay.io/ceph/ceph:v20.2.4
  rbd_pool: replicapool

# Phase 5b GPUs. P400s confirmed on 527f + 49f4 only (ab56: Matrox BMC, none).
gpus:
