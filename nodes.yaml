# Single source of truth for the Harvester cluster.
# Rendered into pxe/config-*.yaml and pxe/boot.ipxe by pxe/render.py.
# Public keys are public: safe to commit. The install token is NOT here;
# render.py reads it from .token (gitignored), $HARVESTER_TOKEN, or --token.

cluster:
  domain: lhm.prod.sigaint.au
  vip: 10.120.14.5
  vip_mode: static
  http_server: http://10.120.14.100/harvester
  iso_url: https://releases.rancher.com/harvester/v1.9.0/harvester-v1.9.0-amd64.iso
  # GAP: checksum file location on releases.rancher.com not confirmed.
  # Verify the ISO out-of-band and fill this in.
  iso_sha256: null
  subnet_mask: 255.255.255.0
  gateway: 10.120.14.1
  mgmt_interface: eno1
  mgmt_mtu: 9000
  trunk_interface: eno2
  install_device: /dev/sda
  data_disk: /dev/sda
  dns_nameservers:
    - 139.99.149.92
    - 139.99.210.89
    - 139.99.210.170
  ntp_servers:
    - time.google.com
    - time1.google.com
    - time2.google.com
    - time3.google.com
  addons:
    harvester_pcidevices_controller: true
  # Rook/Ceph backing for VM storage (redeploy target). Rendered into
  # pxe/config-*.yaml as os.persistent_state_paths + os.modules — required
  # because Harvester's OS is immutable and Rook/Ceph state must survive
  # reboots. Must be present at INSTALL time; cannot be added later.
  os_persistent_state_paths:
    - /var/lib/rook
    - /var/lib/ceph
  os_modules:
    - rbd
    - nbd

