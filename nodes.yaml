# Phase 5a backup target.
backup_target:
  type: nfs
  endpoint: "nfs://10.120.14.100:/Backup"
  refreshIntervalInSeconds: 60

# Storage layout: Longhorn only (no Rook/Ceph), two tiers selected by
# disk tag. Uniform on all three nodes.
# Disk roles per node: sda 250G boot SSD (OS/install), sdb 450G SSD +
# sdc 1T SSD (fast tier), sdd 3.5T HDD (bulk tier).
storage:
  # All Longhorn disks per node. Enforced post-install via
  # workloads/storage/disk-manager.yaml (harvester-node-disk-manager
  # ConfigMap) — apply it BEFORE Longhorn auto-provisions anything else.
  longhorn_disks:
    - /dev/sdb
    - /dev/sdc
    - /dev/sdd
  # Disk tags per tier (device -> tag). Applied post-install via
  # workloads/storage/tag-longhorn-disks.py; tier StorageClasses select
  # disks with diskSelector.
  longhorn_tiers:
    ssd:
      - /dev/sdb
      - /dev/sdc
    hdd:
      - /dev/sdd

# Phase 5b GPUs. P400s confirmed on 527f + 49f4 only (ab56: Matrox BMC, none).
gpus:
