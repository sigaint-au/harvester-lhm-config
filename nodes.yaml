    pci_address: "0000:03:00.0"
    audio_address: "0000:03:00.1"
    resource_name: nvidia.com/GP107GL_QUADRO_P400
  - node: harvester-node-49f4
    pci_address: "0000:03:00.0"
    audio_address: "0000:03:00.1"
    resource_name: nvidia.com/GP107GL_QUADRO_P400
